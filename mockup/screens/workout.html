<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тренировки · Активная тренировка</title>
<meta name="viewport" content="width=390, initial-scale=1">
<link rel="stylesheet" href="../assets/styles.css">
<script src="../assets/icons.js"></script>
<style>
  .section-title {
    color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
    margin: 14px 4px 8px;
  }
  /* Compact ex-tile for tighter vertical space */
  .ex-grid.compact .ex-tile { aspect-ratio: 1 / 0.95; }
</style>
</head>
<body class="standalone">
  <div class="screen">

    <div class="status-bar mono">
      <span>9:41</span>
      <span class="right">
        <svg><use href="#signal"/></svg>
        <svg><use href="#wifi"/></svg>
        <svg><use href="#battery"/></svg>
      </span>
    </div>

    <div class="screen-header">
      <div class="row gap-3" style="align-items:center;">
        <button class="icon-btn" aria-label="Закрыть">
          <svg><use href="#x"/></svg>
        </button>
        <div>
          <h1 style="font-size:20px;">Тренировка</h1>
          <div class="sub mono" style="display:inline-flex; gap:4px; align-items:center;">
            <svg style="width:12px;height:12px;color:var(--accent)"><use href="#clock"/></svg>
            28:14
          </div>
        </div>
      </div>
      <span class="pill accent" style="font-size:11px;">В процессе</span>
    </div>

    <div class="content scrollable" style="padding-bottom: 100px;">

      <!-- Exercise picker -->
      <div class="ex-grid compact">
        <button class="ex-tile">
          <svg><use href="#ex-squat"/></svg>
          <span class="name">Приседания</span>
        </button>
        <button class="ex-tile">
          <svg><use href="#ex-pushup"/></svg>
          <span class="name">Отжимания</span>
        </button>
        <button class="ex-tile active">
          <svg><use href="#ex-pullup"/></svg>
          <span class="name">Подтягивания</span>
        </button>
        <button class="ex-tile">
          <svg><use href="#ex-dip"/></svg>
          <span class="name">Брусья</span>
        </button>
      </div>

      <!-- Mode toggle -->
      <div class="seg" style="margin-top: 14px;">
        <button class="seg-item active">
          <span style="display:inline-flex; gap:6px; align-items:center; justify-content:center;">
            <svg style="width:13px;height:13px;vertical-align:middle;"><use href="#clock"/></svg>
            Секундомер
          </span>
        </button>
        <button class="seg-item">
          <span style="display:inline-flex; gap:6px; align-items:center; justify-content:center;">
            <svg style="width:13px;height:13px;vertical-align:middle;"><use href="#play"/></svg>
            Интервал 45/90
          </span>
        </button>
      </div>

      <!-- Active set card -->
      <div class="active-set" style="margin-top: 12px;">
        <div class="hd">
          <span>Подход 4 · подтягивания</span>
          <span class="rec"><span class="dot"></span>REC</span>
        </div>
        <div class="time-big mono">0:42</div>
        <div class="row between" style="margin-top: 6px;">
          <span class="vest-chip">
            <svg><use href="#vest"/></svg>
            <b class="mono">15</b> кг
          </span>
          <span class="muted xs">нажми «Стоп», когда закончишь</span>
        </div>
        <button class="stop-btn" style="margin-top: 12px;">
          <svg><use href="#pause"/></svg>
          Стоп
        </button>
      </div>

      <!-- Previous sets -->
      <div class="section-title">Подтягивания · подходы</div>
      <div class="set-list">
        <div class="set-row">
          <span class="idx">1</span>
          <div class="main">
            <span class="time mono">0:58</span>
            <span class="vest">
              <svg><use href="#vest"/></svg>
              <span class="mono">10 кг</span>
            </span>
            <span class="rpe-pill">
              <span class="rpe lvl-2"><span class="rpe-seg"></span><span class="rpe-seg"></span><span class="rpe-seg"></span><span class="rpe-seg"></span><span class="rpe-seg"></span></span>
            </span>
          </div>
          <span class="rest mono"><svg><use href="#clock"/></svg>2:00</span>
        </div>
        <div class="set-row">
          <span class="idx">2</span>
          <div class="main">
            <span class="time mono">0:52</span>
            <span class="vest">
              <svg><use href="#vest"/></svg>
              <span class="mono">15 кг</span>
            </span>
            <span class="rpe-pill">
              <span class="rpe lvl-3"><span class="rpe-seg"></span><span class="rpe-seg"></span><span class="rpe-seg"></span><span class="rpe-seg"></span><span class="rpe-seg"></span></span>
            </span>
          </div>
          <span class="rest mono"><svg><use href="#clock"/></svg>2:00</span>
        </div>
        <div class="set-row">
          <span class="idx">3</span>
          <div class="main">
            <span class="time mono">0:47</span>
            <span class="vest">
              <svg><use href="#vest"/></svg>
              <span class="mono">15 кг</span>
            </span>
            <span class="rpe-pill">
              <span class="rpe lvl-4"><span class="rpe-seg"></span><span class="rpe-seg"></span><span class="rpe-seg"></span><span class="rpe-seg"></span><span class="rpe-seg"></span></span>
            </span>
          </div>
          <span class="rest mono"><svg><use href="#clock"/></svg>2:15</span>
        </div>
      </div>

    </div>

    <!-- Finish (sticky bottom) -->
    <div style="position:absolute; left:0; right:0; bottom:0; padding: 12px 20px 22px; background: linear-gradient(180deg, transparent, var(--bg) 40%);">
      <button class="btn">
        <svg><use href="#check"/></svg>
        Завершить тренировку
      </button>
    </div>

  </div>
</body>
</html>
