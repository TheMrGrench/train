<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тренировки · Прогресс</title>
<meta name="viewport" content="width=390, initial-scale=1">
<link rel="stylesheet" href="../assets/styles.css">
<script src="../assets/icons.js"></script>
<style>
  .chart-grid line { stroke: var(--line); stroke-width: 1; }
  .chart-axis-label { fill: var(--muted-2); font-size: 10px; font-family: inherit; }
  .chart-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .chart-area { fill: url(#chartGrad); }
  .chart-dot { fill: var(--accent); }
  .chart-dot.hl {
    fill: var(--accent);
    stroke: var(--bg);
    stroke-width: 3;
  }
  .chart-guide { stroke: var(--muted-2); stroke-dasharray: 3 3; stroke-width: 1; }
  .chart-tip-bg { fill: var(--bg-elev-2); stroke: var(--line); }
  .chart-tip-text { fill: var(--text); font-size: 11px; font-family: inherit; font-weight: 600; }
  .chart-tip-sub { fill: var(--muted); font-size: 10px; font-family: inherit; }
</style>
</head>
<body class="standalone">
  <div class="screen">

    <div class="status-bar mono">
      <span>9:41</span>
      <span class="right">
        <svg><use href="#signal"/></svg>
        <svg><use href="#wifi"/></svg>
        <svg><use href="#battery"/></svg>
      </span>
    </div>

    <div class="screen-header">
      <div>
        <h1>Прогресс</h1>
        <div class="sub">Как идут дела</div>
      </div>
      <button class="icon-btn" aria-label="Фильтры">
        <svg><use href="#settings"/></svg>
      </button>
    </div>

    <div class="content scrollable">

      <!-- Exercise chips -->
      <div class="chips">
        <button class="chip"><svg><use href="#ex-squat"/></svg> Приседания</button>
        <button class="chip"><svg><use href="#ex-pushup"/></svg> Отжимания</button>
        <button class="chip active"><svg><use href="#ex-pullup"/></svg> Подтягивания</button>
        <button class="chip"><svg><use href="#ex-dip"/></svg> Брусья</button>
      </div>

      <!-- Metric segmented -->
      <div class="seg" style="margin-top: 14px;">
        <button class="seg-item active">Макс. повторов</button>
        <button class="seg-item">Объём</button>
        <button class="seg-item">Макс. вес</button>
      </div>

      <!-- Period segmented -->
      <div class="seg" style="margin-top: 8px;">
        <button class="seg-item">1м</button>
        <button class="seg-item active">3м</button>
        <button class="seg-item">6м</button>
        <button class="seg-item">1г</button>
        <button class="seg-item">Всё</button>
      </div>

      <!-- Chart card -->
      <div class="chart-box" style="margin-top: 14px;">
        <div class="chart-hd">
          <div>
            <div class="muted xs" style="text-transform:uppercase; letter-spacing:0.08em; font-weight:600;">Макс. повторов · подтягивания</div>
            <div class="val mono">12 <small>повт</small></div>
          </div>
          <div class="delta mono">+6 за 3 мес</div>
        </div>

        <svg class="chart" viewBox="0 0 330 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7CFF6B" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#7CFF6B" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <!-- Grid -->
          <g class="chart-grid">
            <line x1="24" y1="16"  x2="320" y2="16"/>
            <line x1="24" y1="60"  x2="320" y2="60"/>
            <line x1="24" y1="104" x2="320" y2="104"/>
            <line x1="24" y1="148" x2="320" y2="148"/>
          </g>
          <g class="chart-axis-label">
            <text x="2"  y="20">12</text>
            <text x="2"  y="64">8</text>
            <text x="2"  y="108">4</text>
            <text x="2"  y="152">0</text>
          </g>

          <!-- Area fill -->
          <path class="chart-area"
                d="M24,148 L43,124 L62,112 L81,100 L100,88 L119,88 L138,76 L157,76 L176,64 L195,64 L215,52 L234,40 L253,40 L272,52 L291,28 L310,16 L310,148 L24,148 Z"/>

          <!-- Main line -->
          <path class="chart-line"
                d="M24,148 L43,124 L62,112 L81,100 L100,88 L119,88 L138,76 L157,76 L176,64 L195,64 L215,52 L234,40 L253,40 L272,52 L291,28 L310,16"/>

          <!-- Points -->
          <circle class="chart-dot" cx="24"  cy="148" r="2.5"/>
          <circle class="chart-dot" cx="43"  cy="124" r="2.5"/>
          <circle class="chart-dot" cx="62"  cy="112" r="2.5"/>
          <circle class="chart-dot" cx="81"  cy="100" r="2.5"/>
          <circle class="chart-dot" cx="100" cy="88"  r="2.5"/>
          <circle class="chart-dot" cx="119" cy="88"  r="2.5"/>
          <circle class="chart-dot" cx="138" cy="76"  r="2.5"/>
          <circle class="chart-dot" cx="157" cy="76"  r="2.5"/>
          <circle class="chart-dot" cx="176" cy="64"  r="2.5"/>
          <circle class="chart-dot" cx="195" cy="64"  r="2.5"/>
          <circle class="chart-dot" cx="215" cy="52"  r="2.5"/>
          <circle class="chart-dot" cx="234" cy="40"  r="2.5"/>
          <circle class="chart-dot" cx="253" cy="40"  r="2.5"/>
          <circle class="chart-dot" cx="272" cy="52"  r="2.5"/>
          <circle class="chart-dot" cx="291" cy="28"  r="2.5"/>

          <!-- Highlighted (latest) point w/ tooltip -->
          <line class="chart-guide" x1="310" y1="16" x2="310" y2="148"/>
          <circle class="chart-dot hl" cx="310" cy="16" r="5"/>

          <g transform="translate(244,20)">
            <rect class="chart-tip-bg" width="66" height="34" rx="8"/>
            <text class="chart-tip-text" x="8" y="16">12 повт</text>
            <text class="chart-tip-sub"  x="8" y="28">20 апр</text>
          </g>

          <!-- X labels -->
          <g class="chart-axis-label">
            <text x="14"  y="172">янв</text>
            <text x="108" y="172">фев</text>
            <text x="202" y="172">мар</text>
            <text x="296" y="172">апр</text>
          </g>
        </svg>
      </div>

      <!-- PR tiles -->
      <div class="card-title" style="margin-top: 18px;">Личные рекорды</div>
      <div class="pr-grid">
        <div class="pr-tile">
          <div class="l">Макс. повторов</div>
          <div class="v mono">12<small>× 0 кг</small></div>
        </div>
        <div class="pr-tile">
          <div class="l">Макс. с весом</div>
          <div class="v mono">8<small>× 15 кг</small></div>
        </div>
        <div class="pr-tile">
          <div class="l">Лучший объём</div>
          <div class="v mono">450<small>кг·повт</small></div>
        </div>
      </div>

      <div style="height: 20px;"></div>

    </div>

    <nav class="tab-bar">
      <button class="tab">
        <svg><use href="#home"/></svg>
        <span>Главная</span>
      </button>
      <button class="tab">
        <svg><use href="#history"/></svg>
        <span>История</span>
      </button>
      <button class="tab active">
        <svg><use href="#chart"/></svg>
        <span>Прогресс</span>
      </button>
    </nav>

  </div>
</body>
</html>
