<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тренировки · Главная</title>
<meta name="viewport" content="width=390, initial-scale=1">
<link rel="stylesheet" href="../assets/styles.css">
<script src="../assets/icons.js"></script>
</head>
<body class="standalone">
  <div class="screen">

    <div class="status-bar mono">
      <span>9:41</span>
      <span class="right">
        <svg><use href="#signal"/></svg>
        <svg><use href="#wifi"/></svg>
        <svg><use href="#battery"/></svg>
      </span>
    </div>

    <div class="screen-header">
      <div>
        <h1>Привет 👋</h1>
        <div class="sub">Вторник, 21 апреля</div>
      </div>
      <button class="icon-btn" aria-label="Настройки">
        <svg><use href="#settings"/></svg>
      </button>
    </div>

    <div class="content scrollable">

      <!-- Start CTA -->
      <button class="btn big-primary" style="margin-bottom: 16px;">
        <svg><use href="#plus"/></svg>
        Начать тренировку
      </button>

      <!-- Streak banner -->
      <div class="card" style="display:flex; align-items:center; gap:14px; padding: 14px 16px; margin-bottom: 16px;">
        <div style="width:44px; height:44px; border-radius:12px; background:rgba(255,200,107,.12); color:var(--warn); display:flex; align-items:center; justify-content:center;">
          <svg style="width:22px;height:22px;"><use href="#flame"/></svg>
        </div>
        <div class="grow">
          <div style="font-size:15px; font-weight:600;">Серия: 7 дней</div>
          <div class="sm muted">Не пропусти сегодня!</div>
        </div>
        <div style="color:var(--warn); font-size:24px; font-weight:700;" class="mono">7</div>
      </div>

      <!-- Stats -->
      <div class="card-title" style="margin-top: 8px;">За неделю</div>
      <div class="stats-grid">
        <div class="stat">
          <div class="l">Тренировок</div>
          <div class="v mono">5<small>/7</small></div>
        </div>
        <div class="stat">
          <div class="l">Под нагрузкой</div>
          <div class="v mono">42:18<small>мин</small></div>
        </div>
        <div class="stat">
          <div class="l">Подходов</div>
          <div class="v mono">46</div>
        </div>
        <div class="stat">
          <div class="l">Средний RPE</div>
          <div class="v mono" style="color:#FFC86B;">3.2</div>
        </div>
      </div>

      <!-- Last workout card -->
      <div class="card-title" style="margin-top: 20px;">Последняя тренировка</div>
      <div class="card" style="padding: 14px 16px;">
        <div class="row between" style="margin-bottom: 12px;">
          <div>
            <div style="font-weight: 600;">Вчера · 42 мин</div>
            <div class="sm muted"><span class="mono">8:30</span> под нагрузкой · до <span class="mono">15 кг</span></div>
          </div>
          <span class="pill accent">
            <svg><use href="#check"/></svg>
            Новый PR
          </span>
        </div>
        <div class="row gap-4" style="flex-wrap:wrap;">
          <div class="row gap-2" style="color:var(--muted); font-size:13px;">
            <svg style="width:16px;height:16px;color:var(--accent)"><use href="#ex-pullup"/></svg>
            <span><b class="mono" style="color:var(--text)">3:14</b> подтяг.</span>
          </div>
          <div class="row gap-2" style="color:var(--muted); font-size:13px;">
            <svg style="width:16px;height:16px;color:var(--accent)"><use href="#ex-dip"/></svg>
            <span><b class="mono" style="color:var(--text)">2:48</b> брусья</span>
          </div>
          <div class="row gap-2" style="color:var(--muted); font-size:13px;">
            <svg style="width:16px;height:16px;color:var(--accent)"><use href="#ex-pushup"/></svg>
            <span><b class="mono" style="color:var(--text)">2:28</b> отжим.</span>
          </div>
        </div>
      </div>

    </div>

    <nav class="tab-bar">
      <button class="tab active">
        <svg><use href="#home"/></svg>
        <span>Главная</span>
      </button>
      <button class="tab">
        <svg><use href="#history"/></svg>
        <span>История</span>
      </button>
      <button class="tab">
        <svg><use href="#chart"/></svg>
        <span>Прогресс</span>
      </button>
    </nav>

  </div>
</body>
</html>
