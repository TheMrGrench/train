<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тренировки · Записать подход</title>
<meta name="viewport" content="width=390, initial-scale=1">
<link rel="stylesheet" href="../assets/styles.css">
<script src="../assets/icons.js"></script>
<style>
  .record-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 20px 12px;
  }
  .summary-big {
    text-align: center;
    padding: 24px 0 16px;
  }
  .summary-big .time {
    font-size: 84px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .summary-big .sub {
    color: var(--muted);
    margin-top: 8px;
    font-size: 13px;
    display: inline-flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
  }
  .summary-big .sub .dot { color: var(--muted-2); }
  .section-title {
    color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
    margin: 18px 4px 10px;
  }
  .rpe-legend {
    display: flex;
    justify-content: space-between;
    color: var(--muted-2);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    padding: 0 4px;
    margin-top: 6px;
  }
</style>
</head>
<body class="standalone">
  <div class="screen">

    <div class="status-bar mono">
      <span>9:41</span>
      <span class="right">
        <svg><use href="#signal"/></svg>
        <svg><use href="#wifi"/></svg>
        <svg><use href="#battery"/></svg>
      </span>
    </div>

    <div class="screen-header">
      <div class="row gap-3" style="align-items:center;">
        <button class="icon-btn" aria-label="Отменить">
          <svg><use href="#x"/></svg>
        </button>
        <div>
          <h1 style="font-size:22px;">Подход 4</h1>
          <div class="sub">Подтягивания</div>
        </div>
      </div>
    </div>

    <div class="record-wrap">

      <!-- Big summary -->
      <div class="summary-big">
        <div class="time mono">0:42</div>
        <div class="sub">
          <span class="row gap-2" style="align-items:center;">
            <svg style="width:14px;height:14px;color:var(--muted);"><use href="#vest"/></svg>
            <b class="mono" style="color:var(--text); font-weight:600;">15</b> кг
          </span>
          <span class="dot">·</span>
          <span class="row gap-2" style="align-items:center;">
            <svg style="width:14px;height:14px;color:var(--muted);"><use href="#clock"/></svg>
            время под нагрузкой
          </span>
        </div>
      </div>

      <!-- RPE picker -->
      <div class="section-title" style="margin-top: 4px;">Как было?</div>
      <div class="rpe-picker">
        <button class="lvl-1"><span class="n">1</span><span class="w">Легко</span></button>
        <button class="lvl-2"><span class="n">2</span><span class="w">Норм</span></button>
        <button class="lvl-3"><span class="n">3</span><span class="w">Жёстко</span></button>
        <button class="lvl-4 active"><span class="n">4</span><span class="w">Почти</span></button>
        <button class="lvl-5"><span class="n">5</span><span class="w">Отказ</span></button>
      </div>

      <!-- Optional reps -->
      <div class="section-title">Если хочешь — кол-во повторов</div>
      <div class="optional-input">
        <div class="label">
          Повторы
          <small>Необязательно. Можно пропустить.</small>
        </div>
        <input type="text" value="8" inputmode="numeric">
      </div>

      <!-- Spacer -->
      <div style="flex: 1;"></div>

      <!-- Actions -->
      <div class="col gap-2" style="padding: 8px 0 0;">
        <button class="btn primary">
          <svg><use href="#check"/></svg>
          Записать и начать отдых
        </button>
        <button class="btn ghost">
          Пропустить отдых
        </button>
      </div>

    </div>

  </div>
</body>
</html>
